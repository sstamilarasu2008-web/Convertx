<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvertX</title>
    <link rel="icon" type="image/png" href="Screenshot_24-8-2026_201329_web.whatsapp.com.jpeg">
    <link rel="stylesheet" href="try.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <img src="WhatsApp_Image_2026-08-24_at_6.23.38_AM-removebg-preview.png" alt="ConvertX Logo" class="nav-logo">
        <nav class="nav-links">
            <button onclick="location.href='try.html'">Home</button>
            <button onclick="location.href='home.html'">Converters</button>
            <button onclick="location.href='about.html'">About</button>
        </nav>
    </header>

    <!-- Hero Section -->
    <main class="hero-container">
        <div class="hero-content">
            <h1>Convert Anything,<br><span class="highlight">Anytime.</span></h1>
            <p class="hero-subtitle">Fast, Simple and Accurate Unit Conversions.</p>
            
            <button class="animated-button" onclick="location.href='home.html'">
                <svg xmlns="http://www.w3.org/2000/svg" class="arr-2" viewBox="0 0 24 24"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
                <span class="text">Explore Converters</span>
                <span class="circle"></span>
                <svg xmlns="http://www.w3.org/2000/svg" class="arr-1" viewBox="0 0 24 24"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
            </button>
        </div>
        <div class="hero-image">
            <img src="cal.png.png" alt="Calculator Graphic">
        </div>
    </main>

    <!-- Converters Section -->
    <section class="converters-section">
        <h2>Popular Converters</h2>
        <div class="converters-grid">
            <div class="converter-box"><i class="fa-solid fa-ruler"></i><h5>Length</h5></div>
            <div class="converter-box"><i class="fa-solid fa-gauge-high"></i><h5>Speed</h5></div>
            <div class="converter-box"><i class="fa-solid fa-clock"></i><h5>Clock</h5></div>
            <div class="converter-box"><i class="fa-solid fa-weight-hanging"></i><h5>Weight</h5></div>
            <div class="converter-box"><i class="fa-solid fa-temperature-half"></i><h5>Temperature</h5></div>
            <div class="converter-box"><i class="fa-solid fa-square"></i><h5>Area</h5></div>
        </div>
    </section>

    <!-- Cursor Follower -->
    <div class="cursor-trail"></div>

    <script>
        const trail = document.querySelector(".cursor-trail");
        let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;
            trail.style.left = currentX + "px";
            trail.style.top = currentY + "px";
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
