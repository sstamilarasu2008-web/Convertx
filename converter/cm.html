<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvertX</title>
    <link rel="icon" type="image/png" href="Screenshot_24-8-2026_201329_web.whatsapp.com.jpeg">
    <link rel="stylesheet" href="cm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
</head>

<body>
    <div class="navbar">
        <img src="WhatsApp_Image_2026-08-24_at_6.23.38_AM-removebg-preview.png" width="200px">
        <button onclick="location.href='try.html'"> Home </button>
        <button onclick="location.href='home.html'"> Converters </button>
        <button onclick="location.href='about.html'"> About </button>

    </div>





    <div class="parent">
        <i class="fa-solid fa-ruler-horizontal"></i>
        <b>
            <h4>CM → Inches</h4>
        </b>
        <b>
            <p>Convert CM to Inches.</p>
        </b>
        <div class="inputsection">
            <label>Enter a value...</label>
            <input type="text" placeholder="Enter a value" id="inputfield">
            <label>Result</label>
            <input type="text" readonly>
        </div>
        <div class="buttonsection">
            <button class="convert-btn">Convert</button>
            <button class="convert-btn">Clear</button>
            <button class="convert-btn">Copy</button>

        </div>


    </div>


    <script>
        // ================================
// ConvertX - CM to Inches
// ================================

// Input field
const inputField = document.getElementById("inputfield");

// Result input
const resultField = document.querySelector(".inputsection input[readonly]");

// Buttons
const buttons = document.querySelectorAll(".convert-btn");

const convertButton = buttons[0];
const clearButton = buttons[1];
const copyButton = buttons[2];


// =================================
// CONVERT BUTTON
// =================================

convertButton.addEventListener("click", function () {

    const value = inputField.value.trim();

    // 1. Empty input
    if (value === "") {
        resultField.value = "Please enter a value";
        return;
    }

    // 2. Check valid numeric value
    // Allows: 10, 10.5, 0.5, .5
    // Doesn't allow: abc, 10abc, @#$, etc.
    if (!/^(?:\d+\.?\d*|\.\d+)$/.test(value)) {
        resultField.value = "Please enter a valid numeric value";
        return;
    }

    // Convert input to number
    const cm = parseFloat(value);

    // CM → Inches
    const inches = cm / 2.54;

    // Show result
    resultField.value = `${inches.toFixed(4)} inches`;

    // Clear input after conversion
    inputField.value = "";

});


// =================================
// CLEAR BUTTON
// =================================

clearButton.addEventListener("click", function () {

    // Clear input
    inputField.value = "";

    // Clear result completely
    resultField.value = "";

});


// =================================
// COPY BUTTON
// =================================

copyButton.addEventListener("click", function () {

    const result = resultField.value.trim();

    // Don't copy if result is empty
    if (result === "") {
        return;
    }

    // Don't copy error messages
    if (
        result === "Please enter a value" ||
        result === "Please enter a valid numeric value"
    ) {
        return;
    }

    // Copy result
    navigator.clipboard.writeText(result)
        .then(function () {

            // Save original button text
            const originalText = copyButton.innerText;

            // Show copied message
            copyButton.innerText = "Copied!";

            // Change back after 1.5 seconds
            setTimeout(function () {
                copyButton.innerText = originalText;
            }, 1500);

        })
        .catch(function () {

            // Fallback copy method
            const tempInput = document.createElement("input");

            tempInput.value = result;

            document.body.appendChild(tempInput);

            tempInput.select();
            tempInput.setSelectionRange(0, 99999);

            document.execCommand("copy");

            document.body.removeChild(tempInput);

            // Show copied message
            const originalText = copyButton.innerText;

            copyButton.innerText = "Copied!";

            setTimeout(function () {
                copyButton.innerText = originalText;
            }, 1500);

        });

});


    </script>

</body>

</html>
