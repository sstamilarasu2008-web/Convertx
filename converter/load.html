<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConvertX — Loading</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:#05070d;
    color:white;
}

/* ================= BACKGROUND ================= */

.loading{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,255,200,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(100,70,255,.15),transparent 30%),
        #05070d;
}

/* Grid */

.grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

/* Glow */

.glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:#00ffd5;
    filter:blur(150px);
    opacity:.08;
    animation:glowMove 5s ease-in-out infinite alternate;
}

@keyframes glowMove{
    from{
        transform:translate(-100px,-50px);
    }
    to{
        transform:translate(100px,50px);
    }
}

/* ================= CONTENT ================= */

.content{
    position:relative;
    z-index:5;
    text-align:center;
}

/* Logo */

.logo{
    font-size:clamp(60px,10vw,110px);
    font-weight:900;
    letter-spacing:-6px;
    line-height:1;
    background:linear-gradient(
        90deg,
        #ffffff,
        #65f6d8,
        #8d7aff,
        #ffffff
    );
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradient 4s linear infinite;
}

@keyframes gradient{
    to{
        background-position:300%;
    }
}

/* Tagline */

.tagline{
    margin-top:15px;
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#858da2;
}

/* ================= LOADER ================= */

.loader{
    margin:55px auto 0;
    width:280px;
}

.loader-track{
    width:100%;
    height:4px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
}

.loader-bar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        #65f6d8,
        #7f7cff,
        #65f6d8
    );
    background-size:200%;
    box-shadow:
        0 0 15px rgba(101,246,216,.6);
    animation:
        loading 3.5s ease forwards,
        barGlow 1.5s linear infinite;
}

@keyframes loading{
    to{
        width:100%;
    }
}

@keyframes barGlow{
    to{
        background-position:200%;
    }
}

/* Percentage */

.percent{
    margin-top:15px;
    font-size:13px;
    color:#7d869a;
    letter-spacing:2px;
}

.percent span{
    color:#65f6d8;
    font-weight:700;
}

/* Loading text */

.loading-text{
    margin-top:14px;
    height:20px;
    color:#687185;
    font-size:12px;
    letter-spacing:1px;
}

.loading-text::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{
    0%{content:"."}
    33%{content:".."}
    66%{content:"..."}
    100%{content:""}
}

/* ================= FLOATING CONVERTER ICONS ================= */

.float{
    position:absolute;
    color:rgba(101,246,216,.18);
    font-size:35px;
    font-weight:800;
    animation:float 6s ease-in-out infinite;
}

.f1{
    top:18%;
    left:12%;
}

.f2{
    top:30%;
    right:13%;
    animation-delay:1s;
}

.f3{
    bottom:20%;
    left:18%;
    animation-delay:2s;
}

.f4{
    bottom:15%;
    right:20%;
    animation-delay:3s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-25px) rotate(8deg);
    }
}

/* ================= FOOTER ================= */

.footer{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:#41495a;
    font-size:10px;
    letter-spacing:3px;
    white-space:nowrap;
}

/* ================= EXIT ANIMATION ================= */

.loading.hide{
    animation:fadeOut .7s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .logo{
        font-size:65px;
        letter-spacing:-4px;
    }

    .tagline{
        font-size:10px;
        letter-spacing:3px;
    }

    .loader{
        width:220px;
    }

    .float{
        font-size:25px;
    }

    .f1{left:7%;}
    .f2{right:7%;}
    .f3{left:10%;}
    .f4{right:10%;}

    .footer{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div class="loading" id="loading">

    <div class="grid"></div>
    <div class="glow"></div>

    <!-- Floating conversion symbols -->

    <div class="float f1">↔</div>
    <div class="float f2">%</div>
    <div class="float f3">kg</div>
    <div class="float f4">km</div>

    <!-- Main Content -->

    <div class="content">

        <div class="logo">
            ConvertX
        </div>

        <div class="tagline">
            Convert Anything, Anytime
        </div>

        <div class="loader">

            <div class="loader-track">
                <div class="loader-bar"></div>
            </div>

            <div class="percent">
                Loading <span id="percent">0%</span>
            </div>

            <div class="loading-text">
                Preparing your converter
            </div>

        </div>

    </div>

    <div class="footer">
        FAST • SIMPLE • ACCURATE
    </div>

</div>

<script>

let progress = 0;

const percent = document.getElementById("percent");
const loading = document.getElementById("loading");

const timer = setInterval(() => {

    progress++;

    percent.textContent = progress + "%";

    if(progress >= 100){

        clearInterval(timer);

        setTimeout(() => {

            loading.classList.add("hide");

            /*
             * Replace this with your actual ConvertX page.
             *
             * Example:
             * window.location.href = "home.html";
             */

            setTimeout(() => {

                // Change this to your actual page
                window.location.href = "landingpage.html";

            },700);

        },300);

    }

},35);

</script>

</body>
</html>
